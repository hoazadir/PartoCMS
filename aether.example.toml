# ============================================================
# Aether — Example Configuration (NO SECRETS)
# ============================================================
# این فایل الگوست. حاوی هیچ secret واقعی نیست.
#
# استفاده:
#   1. cp aether.example.toml aether.toml
#   2. مقادیر واقعی را در aether.toml پر کنید
#   3. aether.toml در .gitignore است — هرگز به Git نمی‌رود
#
# گرفتن مقادیر از پنل Aether/Cloudflare:
#   - device_id, access_token, client_id, wg_private_key:
#     پنل Aether → Devices → Add Device → Copy values
#   - wg_peer_public_key: پیش‌فرض Cloudflare WARP (تغییر ندهید)
#   - cert_pem, key_pem: پنل Aether → دستگاه → MASQUE certificate
#
# ترتیب خواندن توسط aether.sh:
#   1. env var (AETHER_ACCESS_TOKEN) — برای Docker/CI/VPS
#   2. aether.local.toml           — override محیط
#   3. aether.toml                 — تنظیمات محلی
#   4. aether.example.toml         — fallback (فقط تست)

# ============ Device Identity ============
device_id     = "YOUR_DEVICE_ID_HERE"
access_token  = "YOUR_ACCESS_TOKEN_HERE"
client_id     = "YOUR_CLIENT_ID"
organization  = ""

# ============ WireGuard Keys ============
wg_private_key     = "YOUR_WG_PRIVATE_KEY_HERE"
wg_peer_public_key = "bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo="

# ============ MASQUE / Client Certificate ============
cert_pem       = ""
key_pem        = ""
cert_issued_at = 0

# ============ Assigned Networking ============
ipv4              = "172.16.0.2"
ipv6              = "YOUR_IPV6_FROM_PANEL"
gateway_proxy     = "172.16.0.1:2480"
assigned_endpoint = "YOUR_ENDPOINT_IP"
